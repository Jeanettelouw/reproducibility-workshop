name: CI

on:
  push:
  pull_request:

jobs:
  reproducibility:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install the pinned Python
        run: uv python install

      - name: Install dependencies
        run: uv sync --locked

      - name: Smoke tests
        run: uv run pytest

      - name: Run the CLI twice with the same seed
        run: |
          uv run python -m reproducible_knn.run --seed 1
          cp outputs/run/metrics.json /tmp/metrics_a.json
          uv run python -m reproducible_knn.run --seed 1
          python -c "
          import json
          a = json.load(open('/tmp/metrics_a.json'))
          b = json.load(open('outputs/run/metrics.json'))
          assert a == b, (a, b)
          print('PASSED: same seed -> same metrics')
          "

      - name: Execute the clean notebook
        run: |
          uv run python -m ipykernel install --user --name python3
          uv run jupyter nbconvert --to notebook --execute \
            --ExecutePreprocessor.kernel_name=python3 \
            --ExecutePreprocessor.timeout=180 \
            --output executed_clean.ipynb \
            notebooks/01_clean_knn_exploration.ipynb
