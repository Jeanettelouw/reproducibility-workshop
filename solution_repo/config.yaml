# All experiment settings in one place.
# Change a value here instead of editing Python code.

seed: 20240719

n_samples: 400
noise: 0.2
# Stretch feature 1 so unscaled Euclidean KNN does poorly.
scale_factor: 10.0

test_size: 0.3

# Neighbour counts tried during cross-validation on the training set.
k_values: [1, 3, 5, 15, 31]

# Put StandardScaler inside the sklearn Pipeline (True) or skip it (False).
use_scaling: true

cv_folds: 3

output_dir: outputs/run
