[project]
name = "reproducible-knn"
version = "0.1.0"
description = "Simple reproducible KNN experiment for a classroom workshop."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
    "numpy>=1.26",
    "pandas>=2.1",
    "scikit-learn>=1.4",
    "matplotlib>=3.8",
    "pyyaml>=6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["reproducible_knn"]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ipykernel>=6.29",
    "nbconvert>=7.16",
    "nbformat>=5.10",
]

[project.optional-dependencies]
notebook = ["jupyterlab>=4.2"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
